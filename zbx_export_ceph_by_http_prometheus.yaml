    discovery_rules:
    - uuid: c31663251ef74816a0f3b506ce3cb5e9
      name: Ceph Monitor discovery
      type: DEPENDENT
      key: ceph.mon.discovery
      master_item:
        key: ceph.prometheus.metrics
      lld_macro_paths:
      - lld_macro: '{#CEPH_DAEMON}'
        path: $.labels['ceph_daemon']
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - ceph_mon_quorum_status
      item_prototypes:
      - uuid: 4e15e50d8bf4448c817b6f50b92c0a33
        name: Monitor {#CEPH_DAEMON} quorum status
        type: DEPENDENT
        key: ceph.mon.quorum[{#CEPH_DAEMON}]
        value_type: UNSIGNED
        master_item:
          key: ceph.prometheus.metrics
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - ceph_mon_quorum_status{ceph_daemon="{#CEPH_DAEMON}"}
          - value
          - ''
        trigger_prototypes:
        - uuid: b0e6d480e62943ac91f0ceb18a498a4f
          expression: last(/Ceph by HTTP Prometheus/ceph.mon.quorum[{#CEPH_DAEMON}])=0
          name: Monitor {#CEPH_DAEMON} out of quorum
          priority: WARNING
      - uuid: 4afd7edf4cf14580a6bac70ced4b73eb
        name: Monitor {#CEPH_DAEMON} slow ops flag
        type: DEPENDENT
        key: ceph.mon.slowops[{#CEPH_DAEMON}]
        value_type: UNSIGNED
        master_item:
          key: ceph.prometheus.metrics
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - ceph_daemon_health_metrics{type="SLOW_OPS",ceph_daemon="{#CEPH_DAEMON}"}
          - value
          - ''
    - uuid: 95a2237ec568489f9eb6194dc8ac5b79
      name: Ceph OSD discovery
      type: DEPENDENT
      key: ceph.osd.discovery
      master_item:
        key: ceph.prometheus.metrics
      lld_macro_paths:
      - lld_macro: '{#CEPH_DAEMON}'
        path: $.labels['ceph_daemon']
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - ceph_osd_up
      item_prototypes:
      - uuid: 896ed4022c1849429c188be544f8fa50
        name: OSD {#CEPH_DAEMON} commit latency
        type: DEPENDENT
        key: ceph.osd.commit[{#CEPH_DAEMON}]
        master_item:
          key: ceph.prometheus.metrics
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - ceph_osd_commit_latency_ms{ceph_daemon="{#CEPH_DAEMON}"}
          - value
          - ''
        tags:
        - tag: source
          value: osd-discovery
        value_type: FLOAT
        units: ms
        trigger_prototypes:
        - uuid: d445b9fa4ba242dfaaad6b42843a3b00
          expression: min(/Ceph by HTTP Prometheus/ceph.osd.commit[{#CEPH_DAEMON}],5m)>{$CEPH.OSD.LATENCY.WARN}
          name: OSD {#CEPH_DAEMON} latency critical (sustained)
          priority: HIGH
      - uuid: ac751758e6da4414acddd260e2f03d70
        name: OSD {#CEPH_DAEMON} apply latency
        type: DEPENDENT
        key: ceph.osd.apply[{#CEPH_DAEMON}]
        master_item:
          key: ceph.prometheus.metrics
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - ceph_osd_apply_latency_ms{ceph_daemon="{#CEPH_DAEMON}"}
