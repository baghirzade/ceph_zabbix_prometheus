          - ''
        tags:
        - tag: source
          value: osd-discovery
        trigger_prototypes:
        - uuid: 2c86a2249c0b4cb69255ee90b52d2869
          expression: last(/Ceph by HTTP Prometheus/ceph.osd.slowops[{#CEPH_DAEMON}])>0
          name: OSD {#CEPH_DAEMON} flagged for slow operations
          priority: WARNING
    - uuid: c22c840089cc44c786d9267438028401
      name: Ceph health check discovery
      type: DEPENDENT
      key: ceph.health.detail.discovery
      item_prototypes:
      - uuid: 0a3f86cda95640f09462742a4cf9fce9
        name: Health check {#CHECK_NAME} ({#CHECK_SEVERITY})
        type: DEPENDENT
        key: ceph.health.detail[{#CHECK_NAME}]
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - ceph_health_detail{name="{#CHECK_NAME}"}
          - value
          - ''
        master_item:
          key: ceph.prometheus.metrics
        tags:
        - tag: source
          value: health-discovery
      master_item:
        key: ceph.prometheus.metrics
      lld_macro_paths:
      - lld_macro: '{#CHECK_NAME}'
        path: $.labels['name']
      - lld_macro: '{#CHECK_SEVERITY}'
        path: $.labels['severity']
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - ceph_health_detail
    macros:
    - macro: '{$CEPH.API.URL}'
      value: http://localhost:9283/metrics
      description: URL of the Ceph mgr Prometheus exporter (ceph mgr module enable prometheus). Override per-host with the active mgr IP.
    - macro: '{$CEPH.RBD.POOL.ID}'
      value: '6'
      description: 'Numeric pool_id of the main RBD pool to monitor (see: ceph osd pool ls detail). Override per cluster.'
    - macro: '{$CEPH.OSD.LATENCY.WARN}'
      value: '500'
      description: OSD commit latency threshold in ms for the sustained high latency trigger.
    - macro: '{$CEPH.POOL.USED.WARN}'
      value: '80'
      description: rbd pool percent-used warning threshold.
    - macro: '{$CEPH.POOL.USED.CRIT}'
      value: '90'
      description: rbd pool percent-used critical threshold.
    - macro: '{$CEPH.SLOWOPS.WARN}'
      value: '10'
      description: Cluster-wide slow ops count warning threshold.
    - macro: '{$CEPH.SLOWOPS.CRIT}'
      value: '50'
      description: Cluster-wide slow ops count critical threshold.
    - macro: '{$CEPH.PG.NOTCLEAN.WARN}'
      value: '20'
      description: Percent of PGs not in clean state, warning threshold.
  triggers:
  - uuid: b7db50e220b2453cb4108eb624e03068
    expression: last(/Ceph by HTTP Prometheus/ceph.pg.total)-last(/Ceph by HTTP Prometheus/ceph.pg.active)>0
    name: Ceph has inactive PGs (I/O blocked)
    priority: HIGH
  - uuid: 40ebbcb868974a9c8b6af2dadcac206b
    expression: last(/Ceph by HTTP Prometheus/ceph.pg.degraded)>0 or last(/Ceph by HTTP Prometheus/ceph.pg.undersized)>0
    name: Ceph PGs degraded or undersized
    priority: WARNING
