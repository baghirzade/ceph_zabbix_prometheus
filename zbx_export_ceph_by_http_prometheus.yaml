        key: ceph.osd.in[{#CEPH_DAEMON}]
        master_item:
          key: ceph.prometheus.metrics
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - ceph_osd_in{ceph_daemon="{#CEPH_DAEMON}"}
          - value
          - ''
        tags:
        - tag: source
          value: osd-discovery
        value_type: UNSIGNED
        trigger_prototypes:
        - uuid: 38ddd7a636904b22a2ece87b07346da6
          expression: last(/Ceph by HTTP Prometheus/ceph.osd.in[{#CEPH_DAEMON}])=0
          name: OSD {#CEPH_DAEMON} is OUT of cluster
          priority: HIGH
      - uuid: c6cf800ccfe44ab8bb2b6d77a8050c9d
        name: OSD {#CEPH_DAEMON} up status
        type: DEPENDENT
        key: ceph.osd.up[{#CEPH_DAEMON}]
        master_item:
          key: ceph.prometheus.metrics
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - ceph_osd_up{ceph_daemon="{#CEPH_DAEMON}"}
          - value
          - ''
        tags:
        - tag: source
          value: osd-discovery
        value_type: UNSIGNED
        trigger_prototypes:
        - uuid: cff93e425e30484eaf1509d9686fbf50
          expression: last(/Ceph by HTTP Prometheus/ceph.osd.up[{#CEPH_DAEMON}])=0
          name: OSD {#CEPH_DAEMON} is DOWN
          priority: DISASTER
      - uuid: 154d281ff5994b84929af31667c11bbe
        name: OSD {#CEPH_DAEMON} slow ops flag
        type: DEPENDENT
        key: ceph.osd.slowops[{#CEPH_DAEMON}]
        value_type: UNSIGNED
        master_item:
          key: ceph.prometheus.metrics
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - ceph_daemon_health_metrics{type="SLOW_OPS",ceph_daemon="{#CEPH_DAEMON}"}
