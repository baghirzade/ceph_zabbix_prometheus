# Ceph by HTTP (Prometheus) - Zabbix template
# Monitors a Ceph cluster via its built-in mgr Prometheus exporter.
# Requires: ceph mgr module enable prometheus  (on the active mgr node)
# See README.md for setup instructions.
# Ceph by HTTP (Prometheus) - Zabbix template
# Monitors a Ceph cluster via its built-in mgr Prometheus exporter.
# Requires: ceph mgr module enable prometheus  (on the active mgr node)
# See README.md for setup instructions.
zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  templates:
  - uuid: 20aa39e08ed64312b9adddd1e3c7f92e
    template: Ceph by HTTP Prometheus
    name: Ceph by HTTP Prometheus
    groups:
    - name: Templates/Applications
    items:
    - uuid: e49d6c09bf2c477dbf571ee4e983fd72
      name: Ceph PG down
      type: DEPENDENT
      key: ceph.pg.down
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - ceph_pg_down
        - function
        - sum
      master_item:
        key: ceph.prometheus.metrics
      triggers:
      - uuid: 61221e55df9d446c9c5d7f410bd0821a
        expression: last(/Ceph by HTTP Prometheus/ceph.pg.down)>0
        name: Ceph PGs down - I/O blocked
        priority: DISASTER
    - uuid: ad7f327ccd6945288b23a2a9566b6256
      name: Ceph PG incomplete
      type: DEPENDENT
      key: ceph.pg.incomplete
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - ceph_pg_incomplete
        - function
        - sum
      master_item:
        key: ceph.prometheus.metrics
      triggers:
      - uuid: cd5a2ffe4e8c4e5da2afd29de0613dd1
        expression: last(/Ceph by HTTP Prometheus/ceph.pg.incomplete)>0
        name: Ceph PGs incomplete
        priority: DISASTER
    - uuid: 8e4f37f57ba04bcab1b8459fe91d8eda
      name: Ceph PG inconsistent
      type: DEPENDENT
      key: ceph.pg.inconsistent
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - ceph_pg_inconsistent
        - function
        - sum
      master_item:
        key: ceph.prometheus.metrics
      triggers:
      - uuid: 2c3b50fab9e84fce85d32ad7d87f7f5a
        expression: last(/Ceph by HTTP Prometheus/ceph.pg.inconsistent)>0
        name: Ceph PGs inconsistent - data integrity risk
        priority: DISASTER
    - uuid: d64222f041314e158911777d111bc1fa
      name: Ceph PGs active
      type: DEPENDENT
      key: ceph.pg.active
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - ceph_pg_active
        - function
        - sum
      master_item:
        key: ceph.prometheus.metrics
    - uuid: 96487f24690d407c8d34375e078fd59f
      name: Ceph PGs degraded
      type: DEPENDENT
      key: ceph.pg.degraded
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - ceph_pg_degraded
        - function
        - sum
      master_item:
        key: ceph.prometheus.metrics
    - uuid: be8252d9224047268d7817d62b6462d2
      name: Ceph PGs not clean (rebalancing/recovery in progress)
      type: CALCULATED
      key: ceph.pg.not_clean_pct
      units: '%'
      params: (last(/{HOST.HOST}/ceph.pg.total)-last(/{HOST.HOST}/ceph.pg.clean))/last(/{HOST.HOST}/ceph.pg.total)*100
      triggers:
      - uuid: 41b1a62e320b4aa48e9d45845948251a
        expression: last(/Ceph by HTTP Prometheus/ceph.pg.not_clean_pct)>{$CEPH.PG.NOTCLEAN.WARN}
        name: More than 20% of PGs are not clean
        priority: WARNING
    - uuid: 02563cca29a644e69f2656c423b849b2
      name: Ceph PGs remapped
      type: DEPENDENT
      key: ceph.pg.remapped
      value_type: UNSIGNED
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - ceph_pg_remapped
        - function
        - sum
      master_item:
        key: ceph.prometheus.metrics
    - uuid: 131a34efcdcf4b5ba6db83a3d073fd7f
      name: Ceph PGs total
      type: DEPENDENT
      key: ceph.pg.total
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - ceph_pg_total
        - function
        - sum
      master_item:
        key: ceph.prometheus.metrics
    - uuid: 1a2463b45f534a8cb3feb3e5337eeee8
