        - function
        - sum
      master_item:
        key: ceph.prometheus.metrics
    - uuid: 55e859b556cc416997d8c2b8c9d2ebbd
      name: Ceph Prometheus metrics
      type: HTTP_AGENT
      key: ceph.prometheus.metrics
      delay: 60s
      value_type: TEXT
      url: '{$CEPH.API.URL}'
    - uuid: 66063e399c37485aba8545099f2bc1df
      name: Ceph active mgr count
